[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-shield-tester"
version = "0.1.0"
description = "Automated security validation and prompt injection testing tool for AI applications."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]